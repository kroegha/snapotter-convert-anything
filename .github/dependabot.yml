version: 2

updates:
  # npm/pnpm dependencies (root lockfile covers entire monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python dependencies (AI sidecar)
  - package-ecosystem: "pip"
    directory: "/packages/ai/python"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Fork: nvidia/cuda is pinned to 13.4.x for native Blackwell. The AI bundle
      # wheels are cu134 torch, onnxruntime-gpu 1.31 (CUDA 13) and a CTranslate2
      # wheel built against the 13.4 devel image, and libcublas-13-4 matches.
      # A newer minor raises the host driver floor and needs the bundles rebuilt,
      # so allow 13.4.x patch bumps only. See the comment above the FROM in
      # docker/Dockerfile.
      - dependency-name: "nvidia/cuda"
        versions: [">= 13.5"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
